# Tunables for bin/dispatch-features.sh (sourced as shell).
# Max concurrently open delegated sessions; edit and wait for the next run.
max_in_flight=5
# Branch prefix for dispatched worktrees.
branch_prefix=feature
# Agent harness passed to `workmux add -a`.
# NOTE: AGENTS.md says `claude-code`, but workmux does not recognize that
# name; `-a claude-code` silently creates shell panes without a prompt.
# `claude` is the recognized harness name, so we dispatch with it.
agent=claude
